name: Build Android arm64 adapter

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.11'

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.85.0'

      - name: Install Android and native build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;28.1.13356709' \
            'cmake;3.31.6'
          echo "$ANDROID_HOME/cmake/3.31.6/bin" >> "$GITHUB_PATH"
          python -m pip install -r scripts/requirements.txt 'conan~=2.12.0' 'ninja==1.13.0'

      - name: Cache Conan recipes and packages
        uses: actions/cache@v4
        id: conan-cache
        with:
          path: ~/.conan2
          key: android-arm64-conan2-v1-${{ hashFiles('conanfile.py', 'conandata.yml', 'scripts/bootstrap_conan_deps.py') }}

      - name: Bootstrap Conan dependencies
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: python3 scripts/bootstrap_conan_deps.py

      - name: Build release AAR for arm64-v8a
        working-directory: platform/android
        run: ./gradlew assembleRelease -PnativeAbi=arm64-v8a --no-daemon

      - name: Verify AAR and write source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import zipfile

          aar = pathlib.Path('platform/android/lib/build/outputs/aar/lib-release.aar')
          output = pathlib.Path('android-arm64-artifact')
          member = 'jni/arm64-v8a/libtrusttunnel_android.so'
          if not aar.is_file():
              raise SystemExit(f'Missing release AAR: {aar}')
          output.mkdir()
          with zipfile.ZipFile(aar) as archive:
              native_members = sorted(name for name in archive.namelist()
                                      if name.startswith('jni/') and name.endswith('.so'))
              if native_members != [member]:
                  raise SystemExit(f'Expected only {member}; found {native_members}')
              if archive.getinfo(member).file_size == 0:
                  raise SystemExit(f'Empty native library: {member}')
              (output / 'libtrusttunnel_android.so').write_bytes(archive.read(member))
          shutil.copy2(aar, output / 'TrustTunnelClient-android-arm64-release.aar')

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def version(*command):
              return subprocess.check_output(command, text=True, stderr=subprocess.STDOUT).splitlines()[0]

          ndk_properties = pathlib.Path(os.environ['ANDROID_HOME']) / 'ndk/28.1.13356709/source.properties'
          ndk_version = next(line.partition('=')[2].strip() for line in ndk_properties.read_text().splitlines()
                             if line.startswith('Pkg.Revision'))
          source_sha = version('git', 'rev-parse', 'HEAD')
          manifest = {
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'source_sha': source_sha,
              'workflow_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'workflow_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'abi': 'arm64-v8a',
              'aar_sha256': sha256(output / 'TrustTunnelClient-android-arm64-release.aar'),
              'so_sha256': sha256(output / 'libtrusttunnel_android.so'),
              'toolchain': {
                  'python': version('python3', '--version'),
                  'conan': version('conan', '--version'),
                  'go': version('go', 'version'),
                  'java': version('java', '-version'),
                  'cmake': version('cmake', '--version'),
                  'ninja': version('ninja', '--version'),
                  'ndk': ndk_version,
                  'android_compile_sdk': '35',
                  'android_build_tools': '35.0.0',
              },
          }
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload verified build for integration testing
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-android-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: android-arm64-artifact/
          if-no-files-found: error
          retention-days: 7
